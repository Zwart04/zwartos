# ZWARTOS config
# ============================================================
#  Daftar OS ditarik otomatis dari repo GitHub berikut (gaya netboot.xyz).
#  Tambah OS baru / perbaiki link mati cukup di repo itu ->
#  semua flashdisk yang pakai ISO ini otomatis ikut terbaru saat online.
#  (Offline / repo gagal = pakai daftar lokal bawaan ISO.)
#  Ganti URL kalau mau pakai repo lain; beri tanda # untuk pakai lokal saja.
# ============================================================

REMOTE_LIST=https://raw.githubusercontent.com/Zwart04/zwartos/main/zwartos-oslist.txt

# Kode negara untuk WiFi 5 GHz (opsional, default kosong = ikut sistem).
# Dipakai untuk "iw reg set" saat menyambung WiFi. Contoh: ID, US, JP, DE.
WIFI_COUNTRY=ID
